<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Germania+One&family=Share+Tech&display=swap" rel="stylesheet">
</head>
<style>
    * {
        scrollbar-width: thin;
        scroll-behavior: smooth;
    }

     * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scroll-behavior: smooth;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #0f172a;
        width: 100%;
        font-family: "Share Tech", system-ui, sans-serif;
        font-weight: 400;
        font-style: normal;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
        color: #f8fafc;
    } 
    .form{
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #1e293b;
        padding: 40px 30px;
        border-radius: 30px;
        width: 100%;
        max-width: 400px;
        border: solid 1px #334155;
        box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
    }

    h2 {
        text-align: center;
        margin: 0 0 20px 0;
        font-family: "Germania One", serif;
        font-size: 2rem;
        color: #38bdf8;
        letter-spacing: 1px;
    }

    form {
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    input {
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 8px;
        border: solid 1px #475569;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: inherit;
        font-size: 1rem;
        width: 100%;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: #38bdf8;
    }

    button {
        margin-top: 10px;
        padding: 15px;
        border-radius: 8px;
        border: none;
        background-color: #38bdf8;
        color: #0f172a;
        font-family: inherit;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #0ea5e9;
    }

    p {
        text-align: center;
        margin-top: 30px;
        margin-bottom: 0;
        color: #94a3b8;
    }

    a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
    }

    a:hover {
        color: #0ea5e9;
        text-decoration: underline;
    }
</style>
<body>
    <div class="form">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
<p>Don't have an account? <a href="/">Register</a></p>
     
        </form>
    </div>
</body>
</html>
